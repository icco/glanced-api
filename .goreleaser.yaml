# GoReleaser configuration.
# https://goreleaser.com
version: 2
project_name: glanced-api
builds:
  - id: glanced-api
    main: ./cmd/glanced-api
    binary: glanced-api
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: ^feat
      order: 0
    - title: Bug Fixes
      regexp: ^fix
      order: 1
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^style:'
release:
  github:
    owner: icco
    name: glanced-api
  mode: replace
  footer: |
    ---

    **Full Changelog**: https://github.com/icco/glanced-api/compare/{{ .PreviousTag }}...{{ .Tag }}
